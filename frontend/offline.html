<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111412" />
    <title>Немає з’єднання — NEXLAB</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111412;color:#eef2ec}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}.card{width:min(100%,620px);padding:clamp(24px,6vw,52px);border:1px solid #334238;border-radius:18px;background:linear-gradient(145deg,#1c2620,#141915)}.brand{color:#81d9b7;font-size:13px;font-weight:700;letter-spacing:.18em}.icon{display:grid;place-items:center;width:54px;height:54px;margin:34px 0 20px;border:1px solid #397e6e;border-radius:50%;color:#8cf0c5;font-size:25px}h1{margin:0;font-size:clamp(30px,7vw,48px);line-height:1.05}p{max-width:46ch;color:#aeb9af;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}a,button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border:1px solid #397e6e;border-radius:8px;background:#19352f;color:#a3f2d1;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}button{background:transparent;color:#d6dfd4}@media(prefers-reduced-motion:no-preference){.icon{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px #397e6e22}}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">NEXLAB / OFFLINE</div>
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>Немає з’єднання</h1>
      <p>Перевір інтернет і спробуй оновити сторінку. Каталог та інструкції, які вже відкривалися на цьому пристрої, можуть бути доступні без мережі. Оформлення замовлень і дані акаунта потребують з’єднання.</p>
      <div class="actions"><button type="button" onclick="location.reload()">Спробувати ще раз</button></div>
    </main>
  </body>
</html>
