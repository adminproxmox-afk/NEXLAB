          - heading "Кроки складання" [level=3] [ref=f1e198]
          - list [ref=f1e199]:
            - listitem [ref=f1e200]: Вимкни ESP32 та переконайся, що OLED має інтерфейс I²C і адресу 0x3C.
            - listitem [ref=f1e201]: Підключи DHT22 до 3V3, GND та GPIO17; підключи OLED до 3V3, GND, GPIO21 (SDA) і GPIO22 (SCL).
            - listitem [ref=f1e202]: Для датчика без готової плати постав резистор 10 кОм між DATA та 3V3.
            - listitem [ref=f1e203]: "В Arduino IDE встанови перелічені бібліотеки, вибери ESP32 Dev Module і відкрий `weather-station.ino`."
            - listitem [ref=f1e204]: Завантаж код. Якщо покази відсутні, перевір адресу OLED і з’єднання DATA датчика.
          - paragraph [ref=f1e205]:
            - strong [ref=f1e206]: "Бібліотеки:"
